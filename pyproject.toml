[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dero-messenger"
version = "0.1.0"
description = "ChainChat research PoC for encrypted messaging over DERO Stargate"
requires-python = ">=3.11"
dependencies = ["cryptography>=44", "httpx>=0.28", "typer>=0.15", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
dero-chat = "dero_messenger.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
